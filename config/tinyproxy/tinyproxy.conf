User nobody
Group nobody
Port 8888
Listen 127.0.0.1
Timeout 1800
DefaultErrorFile "/opt/homebrew/share/tinyproxy/default.html"
# Syslog On
LogFile "/Users/aetherclaude/logs/tinyproxy-access.log"
LogLevel Info
MaxClients 20
MaxRequestsPerChild 50
MinSpareServers 2
MaxSpareServers 5
StartServers 3
Allow 127.0.0.1
Allow ::1
ViaProxyName "tinyproxy"
Filter "/opt/homebrew/etc/tinyproxy/allowlist"
FilterURLs Off
FilterDefaultDeny Yes
ConnectPort 443
